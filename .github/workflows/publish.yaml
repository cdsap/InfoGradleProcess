name: Publish Gradle Plugin

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Gradle Plugin Portal
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${RELEASE_TAG#v}"
          if [[ -z "$tag_version" || "$tag_version" == "$RELEASE_TAG" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must use the v<version> format"
            exit 1
          fi

          project_version="$(./gradlew -q :plugin:properties | sed -n 's/^version: //p' | head -n 1)"
          if [[ -z "$project_version" ]]; then
            echo "::error::Could not determine the :plugin project version"
            exit 1
          fi
          if [[ "$project_version" == *SNAPSHOT* ]]; then
            echo "::error::Refusing to publish snapshot project version '$project_version'"
            exit 1
          fi
          if [[ "$project_version" != "$tag_version" ]]; then
            echo "::error::Release tag version '$tag_version' does not match project version '$project_version'"
            exit 1
          fi

          echo "Publishing final InfoGradleProcess version $project_version"

      - name: Check Plugin Portal credentials
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GRADLE_PUBLISH_KEY:-}" || -z "${GRADLE_PUBLISH_SECRET:-}" ]]; then
            echo "::error::GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET repository secrets are required"
            exit 1
          fi

      - name: Validate Gradle plugin
        run: ./gradlew validatePlugins --stacktrace

      - name: Publish Gradle plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishPlugins --stacktrace
